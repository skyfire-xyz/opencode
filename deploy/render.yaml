# Render Blueprint — one web service: opencode server + embedded web UI.
# Deploy: push this repo to Git, then in Render → New → Blueprint (reads this file).
# Or create a Web Service manually with runtime=Docker, Dockerfile path ./deploy/Dockerfile.
services:
  - type: web
    name: opencode-demo
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: . # build context = repo root (the Dockerfile copies the whole monorepo)
    plan: standard # the build is heavy; standard gives runtime headroom (starter may be tight)
    # Persist auth tokens / sessions / minted KYA tokens across restarts.
    disk:
      name: opencode-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # --- secrets: set these in the Render dashboard (sync:false = not in git) ---
      - key: SKYFIRE_API_KEY # resolves {env:SKYFIRE_API_KEY} in OPENCODE_CONFIG_CONTENT below
        sync: false
      - key: OPENCODE_SERVER_PASSWORD # locks the server: HTTP Basic auth, username "opencode"
        sync: false
      # Optional — opencode serves free models by default (no key needed). Add a provider
      # key only for paid/higher-quality models instead of the free tier:
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # --- the whole opencode config, injected via env (issuer-only for step 1) ---
      - key: OPENCODE_CONFIG_CONTENT
        value: '{"$schema":"https://opencode.ai/config.json","mcp":{"skyfire":{"type":"remote","enabled":true,"url":"https://mcp-qa.skyfire.xyz/mcp","capabilities":{"org.kyapay:kya":{"tool":"create-kya-token"},"org.kyapay:pay":{"tool":"create-pay-token"}},"headers":{"skyfire-api-key":"{env:SKYFIRE_API_KEY}"}}}}'
